<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Summit</title>
<link rel="icon" href="data:,">
<meta name="description" content="A free, open-source mountaintop meditation for Meta Quest and any browser.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9c9b0; color: #fff;
    font: 18px/1.5 system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  [hidden] { display: none !important; }
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1rem; text-align: center; padding: 16px;
    background: rgba(20, 24, 44, .6); }
  h1 { font-weight: 300; font-size: 2.6rem; margin: 0; letter-spacing: .08em; }
  p { margin: 0; max-width: 34rem; opacity: .9; }
  button { font: inherit; color: #fff; background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .6); border-radius: 999px; padding: .8rem 1.8rem; cursor: pointer; }
  button:hover, button:focus-visible { background: rgba(255, 255, 255, .3); }
  #lengths { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  #end { position: fixed; bottom: 16px; right: 16px; background: rgba(20, 24, 44, .6); }
  a { color: #ffd9a0; }
</style>
</head>
<body>
<div id="ui">
  <h1>Quiet Summit</h1>
  <p>Sit on a mountaintop at sunrise. The sun's glow and the wind swell and fade at a slow
    breathing pace: follow them if you like, or just look out over the valley.</p>
  <div id="lengths">
    <button data-min="5">5 minutes</button>
    <button data-min="10">10 minutes</button>
    <button data-min="20">20 minutes</button>
  </div>
  <p><small>In a headset this opens in VR; on a screen, drag to look around. Free and open source:
    <a href="https://github.com/doktorigi/quiet-summit">source</a>.</small></p>
</div>
<button id="end" hidden>End session</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// Sound levels can only be judged in the headset: tune these two by ear.
const WIND_LEVEL = 0.5, DRONE_LEVEL = 0.08;

// ponytail: one fixed pace (4s in, 2s hold, 6s out). Add a pace picker if people ask.
const PHASES = [['in', 4], ['hold', 2], ['out', 6]];
const CYCLE = PHASES.reduce((s, p) => s + p[1], 0);
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * x);

// Seconds since session start -> how full the lungs are (0 = empty, 1 = full).
function breath(t) {
  let u = ((t % CYCLE) + CYCLE) % CYCLE;
  for (const [phase, len] of PHASES) {
    if (u < len) return phase === 'in' ? ease(u / len) : phase === 'hold' ? 1 : 1 - ease(u / len);
    u -= len;
  }
}

// ---------- landscape maths (deterministic: the same mountain every visit) ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const hash = (i, j) => { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); };
function noise(x, y) {
  const i = Math.floor(x), j = Math.floor(y), u = x - i, w = y - j;
  const a = u * u * (3 - 2 * u), b = w * w * (3 - 2 * w);
  const top = hash(i, j) + (hash(i + 1, j) - hash(i, j)) * a;
  const bot = hash(i, j + 1) + (hash(i + 1, j + 1) - hash(i, j + 1)) * a;
  return top + (bot - top) * b;
}
function fbm(x, y, octaves = 5) {
  let s = 0, amp = 0.5;
  for (let o = 0; o < octaves; o++) { s += amp * noise(x, y); x *= 2.03; y *= 2.03; amp *= 0.5; }
  return s / (1 - amp * 2);
}

const WATER = -430; // lake level; you sit at y = 0
// Your peak at the origin dropping steeply to a valley ring, then far ranges at about eye level.
function height(x, z) {
  const r = Math.hypot(x, z);
  const ridge = 1 - Math.abs(2 * fbm(x / 900 + 7, z / 900 + 3, 3) - 1);
  return -25 - 395 * (1 - Math.exp(-r / 400))
    + (fbm(x / 600, z / 600) - 0.5) * 160 * sm(60, 500, r)
    + (100 + 800 * ridge * ridge) * sm(1500, 2700, r);
}

if (location.hash === '#test') {
  const eq = (a, b) => { if (Math.abs(a - b) > 1e-9) throw new Error(`check: ${a} != ${b}`); };
  eq(breath(0), 0); eq(breath(2), 0.5); eq(breath(5), 1); eq(breath(9), 0.5); eq(breath(CYCLE + 2), 0.5);
  eq(height(0, 0), -25);
  // Nothing within 1.4 km may rise above the seat, or it stops being an overlook.
  for (let a = 0; a < 6.28; a += 0.05) for (let r = 30; r <= 1400; r += 35) {
    if (height(Math.cos(a) * r, Math.sin(a) * r) > -20) throw new Error(`terrain blocks the view at r=${r}`);
  }
  document.title = 'tests ok';
}

// ---------- scene: no lights or textures, sunrise lighting is baked into vertex colours ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.prepend(renderer.domElement);

const HAZE = new THREE.Color('#e9c9b0');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(HAZE, 300, 5500);
// near 0.3 keeps depth precision usable out at the far shoreline
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.3, 12000);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.5, 0);
let yaw = 0, pitch = -0.1;
camera.rotation.set(pitch, yaw, 0);

const SUN = new THREE.Vector3(-0.2, 0.19, -0.96).normalize(); // direction towards the sun
const AMBIENT = new THREE.Color(0.42, 0.47, 0.62), SUNLIGHT = new THREE.Color(0.95, 0.78, 0.6);
const tri = new THREE.Triangle(), nrm = new THREE.Vector3(), mid = new THREE.Vector3();

// Flat-shade a geometry: paint(centroid, normal) picks each face's base colour, the sun does the rest.
function bake(geo, paint) {
  if (geo.index) geo = geo.toNonIndexed();
  const p = geo.attributes.position, col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i += 3) {
    tri.a.fromBufferAttribute(p, i); tri.b.fromBufferAttribute(p, i + 1); tri.c.fromBufferAttribute(p, i + 2);
    tri.getNormal(nrm); tri.getMidpoint(mid);
    const base = paint(mid, nrm), d = Math.max(0, nrm.dot(SUN));
    for (let k = 0; k < 3; k++) {
      col[(i + k) * 3] = base.r * (AMBIENT.r + SUNLIGHT.r * d);
      col[(i + k) * 3 + 1] = base.g * (AMBIENT.g + SUNLIGHT.g * d);
      col[(i + k) * 3 + 2] = base.b * (AMBIENT.b + SUNLIGHT.b * d);
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}
const baked = new THREE.MeshBasicMaterial({ vertexColors: true });
const add = (geo, paint) => { const m = new THREE.Mesh(bake(geo, paint), baked); scene.add(m); return m; };

const SNOW = new THREE.Color('#f2f0ee'), ROCK = new THREE.Color('#857970'), ROCK_DARK = new THREE.Color('#6e645e'),
  MEADOW = new THREE.Color('#7d9a5c'), FOREST = new THREE.Color('#3f6b4a'), WHITE = new THREE.Color('#ffffff');

// Sky dome: haze at the horizon, blue overhead, warmer towards the sun.
const SKY_R = 9000;
const skyGeo = new THREE.SphereGeometry(SKY_R, 48, 32);
{
  const p = skyGeo.attributes.position, col = [], c = new THREE.Color(), dir = new THREE.Vector3();
  const LOW = new THREE.Color('#a9c3e0'), ZENITH = new THREE.Color('#3d68a8'), WARM = new THREE.Color('#ffd9a8');
  for (let i = 0; i < p.count; i++) {
    dir.fromBufferAttribute(p, i).divideScalar(SKY_R);
    const t = Math.max(0, dir.y);
    c.copy(HAZE).lerp(LOW, sm(0, 0.22, t)).lerp(ZENITH, sm(0.15, 1, t));
    c.lerp(WARM, 0.6 * Math.max(0, dir.dot(SUN)) ** 4 * (1 - t));
    col.push(c.r, c.g, c.b);
  }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
}
scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));

const sun = new THREE.Mesh(new THREE.CircleGeometry(170, 32), new THREE.MeshBasicMaterial({ color: '#fff1d0', fog: false }));
sun.position.copy(SUN).multiplyScalar(7000);
sun.lookAt(0, 0, 0);
scene.add(sun);

const haloCv = document.createElement('canvas'); haloCv.width = haloCv.height = 128;
const hg = haloCv.getContext('2d'), grad = hg.createRadialGradient(64, 64, 0, 64, 64, 64);
grad.addColorStop(0, 'rgba(255,228,180,.9)'); grad.addColorStop(0.3, 'rgba(255,215,165,.35)'); grad.addColorStop(1, 'rgba(255,215,165,0)');
hg.fillStyle = grad; hg.fillRect(0, 0, 128, 128);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(haloCv),
  blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, fog: false }));
halo.position.copy(sun.position);
halo.renderOrder = 10;
scene.add(halo);

// Terrain: 6 km square, 30 m cells (80k triangles, fine on a Quest 2).
const terrainGeo = new THREE.PlaneGeometry(6000, 6000, 200, 200).rotateX(-Math.PI / 2);
{
  const p = terrainGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, height(p.getX(i), p.getZ(i)));
}
add(terrainGeo, (m, n) => {
  const v = noise(m.x / 90, m.z / 90);
  if (m.y > 40 + 120 * v && n.y > 0.45) return SNOW;
  if (n.y < 0.8 || m.y > -260 + 80 * v) return v > 0.5 ? ROCK : ROCK_DARK;
  return v > 0.5 ? FOREST : MEADOW;
});

const water = new THREE.Mesh(new THREE.CircleGeometry(3400, 48), new THREE.MeshBasicMaterial({ color: '#9fb9cc' }));
water.rotation.x = -Math.PI / 2;
water.position.y = WATER;
scene.add(water);

// The summit you sit on: a flat-topped crag that flares down into the terrain below.
const summitGeo = new THREE.CylinderGeometry(2.6, 60, 100, 11, 8).translate(0, -50, 0);
{
  const p = summitGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (Math.hypot(x, z) < 0.1) continue;
    const k = 1 + (noise(x * 0.35 + 3, z * 0.35 + y * 0.9) - 0.5) * 0.5;
    p.setXYZ(i, x * k, y < -0.01 && y > -99 ? y + (noise(x * 0.2 + 9, z * 0.2) - 0.5) * 3 : y, z * k);
  }
}
add(summitGeo, (m, n) => (n.y > 0.9 ? ROCK : ROCK_DARK));

// Loose stones and a small cairn: [x, z, size, y]
const stones = [[1.9, -1.2, 0.35], [-2.0, -0.6, 0.28], [-1.5, 1.6, 0.4], [1.2, 2.0, 0.3], [2.2, 0.5, 0.22],
  [-1.1, -1.9, 0.28], [-1.1, -1.9, 0.21, 0.3], [-1.08, -1.92, 0.15, 0.53], [-1.1, -1.9, 0.1, 0.7]];
stones.forEach(([x, z, s, y = 0], i) => add(
  new THREE.DodecahedronGeometry(s, 0).scale(1, 0.65, 1.2).rotateY(i * 1.7).translate(x, y + s * 0.4, z),
  () => (i % 2 ? ROCK : ROCK_DARK)));

// Low-poly clouds drifting around the far ranges.
const clouds = new THREE.Group();
for (let i = 0; i < 12; i++) {
  const g = new THREE.IcosahedronGeometry(1, 1), p = g.attributes.position;
  for (let j = 0; j < p.count; j++) {
    const k = 0.7 + 0.6 * fbm(p.getX(j) * 1.5 + i * 9, p.getY(j) * 1.5 + p.getZ(j) * 1.7);
    p.setXYZ(j, p.getX(j) * k, p.getY(j) * k, p.getZ(j) * k);
  }
  const a = i * 2.4 + hash(i, 1), r = 1300 + 1500 * hash(i, 2), s = 90 + 130 * hash(i, 3);
  g.scale(s * 1.8, s * 0.6, s).rotateY(a).translate(Math.cos(a) * r, -120 + 420 * hash(i, 4), Math.sin(a) * r);
  clouds.add(new THREE.Mesh(bake(g, () => WHITE), baked));
}
scene.add(clouds);

// ---------- sound (all synthesised, no audio files) ----------
let ctx, sound;
function startAudio() {
  ctx ??= new AudioContext();
  ctx.resume();
  const now = ctx.currentTime, out = ctx.createGain();
  out.gain.setValueAtTime(0, now);
  out.gain.linearRampToValueAtTime(1, now + 4);
  out.connect(ctx.destination);

  // wind: looped white noise through a band-pass, with a slow gust
  const buf = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), wind = ctx.createGain();
  const gust = ctx.createOscillator(), gustAmt = ctx.createGain();
  src.buffer = buf; src.loop = true;
  bp.type = 'bandpass'; bp.frequency.value = 300; bp.Q.value = 0.5;
  wind.gain.value = WIND_LEVEL * 0.7;
  gust.frequency.value = 0.06; gustAmt.gain.value = WIND_LEVEL * 0.3;
  gust.connect(gustAmt).connect(wind.gain);
  src.connect(bp).connect(wind).connect(out);

  // quiet warm drone underneath
  const lp = ctx.createBiquadFilter(), droneGain = ctx.createGain();
  lp.frequency.value = 250; droneGain.gain.value = DRONE_LEVEL;
  lp.connect(droneGain).connect(out);
  const oscs = [110, 110.6, 165, 220.4].map(f => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = f; g.gain.value = 0.25;
    o.connect(g).connect(lp);
    return o;
  });
  const sources = [src, gust, ...oscs];
  sources.forEach(s => s.start());
  sound = { out, bp, lp, sources };
}
function stopAudio() {
  if (!sound) return;
  const { out, sources } = sound, now = ctx.currentTime;
  sound = null;
  out.gain.cancelScheduledValues(now);
  out.gain.setValueAtTime(out.gain.value, now);
  out.gain.linearRampToValueAtTime(0, now + 3);
  sources.forEach(s => s.stop(now + 3));
}
function bell() {
  const now = ctx.currentTime;
  for (const [f, vol] of [[528, 0.3], [1056, 0.08], [1584, 0.04]]) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = f;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 5);
    o.connect(g).connect(ctx.destination);
    o.start(now); o.stop(now + 5);
  }
}

// ---------- session ----------
const ui = document.getElementById('ui'), endBtn = document.getElementById('end');
let running = false, t0 = 0, duration = 0, xrSession = null, vrOK = false;
navigator.xr?.isSessionSupported('immersive-vr').then(ok => { vrOK = ok; }).catch(() => {});

async function start(minutes) {
  startAudio(); bell();
  duration = minutes * 60; t0 = performance.now(); running = true;
  ui.hidden = true; endBtn.hidden = false;
  if (!vrOK) return;
  try {
    xrSession = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
    xrSession.addEventListener('end', () => { xrSession = null; stop(); });
    await renderer.xr.setSession(xrSession);
    t0 = performance.now(); // the permission prompt shouldn't eat session time
  } catch (e) {
    console.warn('VR unavailable, playing on screen instead', e);
    xrSession?.end().catch(() => {});
  }
}
function stop() {
  if (!running) return;
  running = false;
  bell(); stopAudio();
  ui.hidden = false; endBtn.hidden = true;
  xrSession?.end().catch(() => {});
}
document.getElementById('lengths').addEventListener('click', e => {
  const min = Number(e.target.dataset?.min);
  if (min) start(min);
});
endBtn.addEventListener('click', stop);

// On a flat screen, drag to look around (the headset does this by itself).
renderer.domElement.addEventListener('pointermove', e => {
  if (!e.buttons || renderer.xr.isPresenting) return;
  yaw += e.movementX * 0.003;
  pitch = clamp(pitch + e.movementY * 0.003, -1.2, 1.2);
  camera.rotation.set(pitch, yaw, 0);
});
addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  const now = performance.now(), t = (running ? now - t0 : now) / 1000, b = breath(t);
  halo.scale.setScalar(2200 + 900 * b);
  halo.material.opacity = 0.55 + 0.35 * b;
  clouds.rotation.y = now * 4e-7; // about 1 m/s out at the far ranges
  // Wind and drone open up on the in-breath, so the pace can be followed with eyes closed.
  if (sound) {
    sound.bp.frequency.setTargetAtTime(260 + 240 * b, ctx.currentTime, 0.2);
    sound.lp.frequency.setTargetAtTime(250 + 450 * b, ctx.currentTime, 0.1);
  }
  if (running && t >= duration) stop();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
