<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Summit</title>
<link rel="icon" href="data:,">
<meta name="description" content="A free, open-source mountaintop meditation for Meta Quest and any browser.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9c9b0; color: #fff;
    font: 18px/1.5 system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  [hidden] { display: none !important; }
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1rem; text-align: center; padding: 16px;
    background: rgba(20, 24, 44, .6); }
  h1 { font-weight: 300; font-size: 2.6rem; margin: 0; letter-spacing: .08em; }
  p { margin: 0; max-width: 34rem; opacity: .9; }
  button { font: inherit; color: #fff; background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .6); border-radius: 999px; padding: .8rem 1.8rem; cursor: pointer; }
  button:hover, button:focus-visible { background: rgba(255, 255, 255, .3); }
  #lengths { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  #end { position: fixed; bottom: 16px; right: 16px; background: rgba(20, 24, 44, .6); }
  a { color: #ffd9a0; }
</style>
</head>
<body>
<div id="ui">
  <h1>Quiet Summit</h1>
  <p>Sit on a mountaintop at sunrise. The sun's glow and the wind swell and fade at a slow
    breathing pace: follow them if you like, or just look out over the valley.</p>
  <p id="loading">Preparing the mountain…</p>
  <div id="lengths" hidden>
    <button data-min="5">5 minutes</button>
    <button data-min="10">10 minutes</button>
    <button data-min="20">20 minutes</button>
  </div>
  <p><small>In a headset this opens in VR; on a screen, drag to look around. Free and open source:
    <a href="https://github.com/doktorigi/quiet-summit">source</a>.</small></p>
</div>
<button id="end" hidden>End session</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// Sound levels can only be judged in the headset: tune these two by ear.
const WIND_LEVEL = 0.5, DRONE_LEVEL = 0.08;

// ponytail: one fixed pace (4s in, 2s hold, 6s out). Add a pace picker if people ask.
const PHASES = [['in', 4], ['hold', 2], ['out', 6]];
const CYCLE = PHASES.reduce((s, p) => s + p[1], 0);
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * x);

// Seconds since session start -> how full the lungs are (0 = empty, 1 = full).
function breath(t) {
  let u = ((t % CYCLE) + CYCLE) % CYCLE;
  for (const [phase, len] of PHASES) {
    if (u < len) return phase === 'in' ? ease(u / len) : phase === 'hold' ? 1 : 1 - ease(u / len);
    u -= len;
  }
}

// ---------- landscape maths (deterministic: the same mountain on every device) ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const hash = (i, j) => {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
// Value noise. Pass a period P (in lattice cells) to make it tile.
function noise(x, y, P = 0) {
  const i = Math.floor(x), j = Math.floor(y), u = x - i, w = y - j;
  const a = u * u * (3 - 2 * u), b = w * w * (3 - 2 * w);
  let i0 = i, i1 = i + 1, j0 = j, j1 = j + 1;
  if (P) { i0 = ((i % P) + P) % P; i1 = (i0 + 1) % P; j0 = ((j % P) + P) % P; j1 = (j0 + 1) % P; }
  const h00 = hash(i0, j0), h01 = hash(i0, j1);
  const top = h00 + (hash(i1, j0) - h00) * a, bot = h01 + (hash(i1, j1) - h01) * a;
  return top + (bot - top) * b;
}
function fbm(x, y, octaves = 5, P = 0) {
  let s = 0, amp = 0.5;
  for (let o = 0; o < octaves; o++) { s += amp * noise(x, y, P); x = x * 2 + 19.19; y = y * 2 + 7.77; P *= 2; amp *= 0.5; }
  return s / (1 - amp * 2);
}

// Ridged multifractal: sharp crests that carry the fine detail, smooth valleys between them.
function ridged(x, y) {
  let s = 0, amp = 0.5, w = 1;
  for (let o = 0; o < 6; o++) {
    let n = 1 - Math.abs(2 * noise(x, y) - 1);
    n *= n; s += amp * n * w; w = clamp(n * 1.6);
    x = x * 2 + 19.19; y = y * 2 + 7.77; amp *= 0.5;
  }
  return s;
}

const WATER = -418; // lake level; you sit at y = 0
// Your peak at the origin dropping steeply to a valley ring, then far ranges at about eye level.
function height(x, z) {
  const r = Math.hypot(x, z);
  const wx = x + 260 * (fbm(x / 1100 + 1.7, z / 1100 + 9.2, 2) - 0.5);
  const wz = z + 260 * (fbm(x / 1100 + 5.1, z / 1100 + 3.3, 2) - 0.5);
  const big = 0.55 + 0.9 * fbm(x / 2300 + 13, z / 2300 + 29, 2); // some massifs tower, some stay low
  return -25 - 395 * (1 - Math.exp(-r / 400))
    + (fbm(x / 600, z / 600, 6) - 0.5) * 400 * sm(60, 500, r)
    + (100 + 950 * ridged(wx / 1000 + 7, wz / 1000 + 3) * big) * sm(1500, 2700, r);
}

if (location.hash === '#test') {
  const eq = (a, b) => { if (Math.abs(a - b) > 1e-9) throw new Error(`check: ${a} != ${b}`); };
  eq(breath(0), 0); eq(breath(2), 0.5); eq(breath(5), 1); eq(breath(9), 0.5); eq(breath(CYCLE + 2), 0.5);
  eq(height(0, 0), -25);
  eq(noise(3.3, 9.1, 8), noise(11.3, 1.1, 8)); // tiling noise really tiles
  // Nothing within 1.4 km may rise above the seat, or it stops being an overlook.
  for (let a = 0; a < 6.28; a += 0.05) for (let r = 30; r <= 1400; r += 35) {
    if (height(Math.cos(a) * r, Math.sin(a) * r) > -20) throw new Error(`terrain blocks the view at r=${r}`);
  }
  document.title = 'tests ok';
}

// ---------- renderer ----------
const buildStart = performance.now();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // nothing near you moves: render the shadow map once
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 12000);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.5, 0);
let yaw = 0, pitch = -0.1;
camera.rotation.set(pitch, yaw, 0);

const SUN = new THREE.Vector3(-0.2, 0.36, -0.93).normalize(); // direction towards the sun, about 20 degrees up
const ANISO = Math.min(4, renderer.capabilities.getMaxAnisotropy());
function dataTexture(data, w, h, srgb, wrap = THREE.RepeatWrapping) {
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = wrap;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true; t.anisotropy = ANISO; t.needsUpdate = true;
  return t;
}

// Tiling noise the shaders sample at several scales (a different pattern per channel).
const NT = 256, noiseData = new Uint8Array(NT * NT * 4);
for (let y = 0, i = 0; y < NT; y++) for (let x = 0; x < NT; x++, i += 4) {
  const u = x / NT, v = y / NT;
  noiseData[i] = 255 * fbm(u * 8, v * 8, 5, 8);
  noiseData[i + 1] = 255 * fbm(u * 4 + 31, v * 4 + 17, 6, 4);
  noiseData[i + 2] = 255 * fbm(u * 16 + 5, v * 16 + 71, 4, 16);
  noiseData[i + 3] = 255 * fbm(u * 6 + 47, v * 6 + 3, 5, 6);
}
const U = { uBreath: { value: 0 }, uTime: { value: 0 }, tNoise: { value: dataTexture(noiseData, NT, NT, false) } };

// ---------- shaders: one sky model shared by the sky, the haze and the lake reflections ----------
const g3 = v => `vec3(${v.x.toFixed(5)}, ${v.y.toFixed(5)}, ${v.z.toFixed(5)})`;
const col = hex => { const c = new THREE.Color(hex); return `vec3(${c.r.toFixed(4)}, ${c.g.toFixed(4)}, ${c.b.toFixed(4)})`; };
const VERT = `
varying vec2 vUv; varying vec3 vW;
void main() { vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const COMMON = `
uniform float uBreath, uTime;
uniform sampler2D tNoise;
varying vec2 vUv; varying vec3 vW;
const vec3 SUN = ${g3(SUN)};
const vec3 SUNC = vec3(1.0, 0.84, 0.66);  // sunlight
const vec3 AMB = vec3(0.30, 0.36, 0.50);   // skylight in the shade
vec3 skyColor(vec3 d, float core, float glow) {
  float h = max(d.y, 0.0), s = max(dot(d, SUN), 0.0);
  vec3 c = mix(${col('#b7cfe8')}, ${col('#2c5a9c')}, pow(h, 0.55));
  c = mix(c, ${col('#ffc48a')}, exp(-h * 6.0) * (0.12 + 0.7 * s * s));
  // the glow around the sun widens and brightens with the in-breath
  c += vec3(1.0, 0.8, 0.55) * (glow * 0.3 * pow(s, mix(16.0, 9.0, uBreath)) * (0.7 + 0.6 * uBreath) + core * 1.5 * pow(s, 300.0));
  return c;
}
// Haze that is thicker down in the valley and takes the colour of the sky behind it.
vec3 haze(vec3 c, vec3 w, float extra) {
  vec3 rd = w - cameraPosition; float dist = length(rd); rd /= dist;
  float t = rd.y * dist / 350.0;
  float k = abs(t) < 0.001 ? dist : dist * (1.0 - exp(-t)) / t;
  float f = 1.0 - exp(-0.0003 * exp(-(cameraPosition.y - (${WATER}.0)) / 350.0) * k);
  return mix(c, skyColor(rd, 0.0, 0.4), max(f, extra));
}`;
const material = (fragment, uniforms = {}, extra = {}) => new THREE.ShaderMaterial({
  vertexShader: VERT, fragmentShader: COMMON + fragment, uniforms: { ...U, ...uniforms }, ...extra });

scene.add(new THREE.Mesh(new THREE.SphereGeometry(9000, 32, 16), material(`
void main() {
  vec3 d = normalize(vW - cameraPosition);
  float s = dot(d, SUN);
  vec3 c = skyColor(d, 1.0, 1.0) + vec3(1.0, 0.92, 0.8) * 4.0 * smoothstep(0.99988, 0.99996, s);
  // thin high cirrus, drifting slowly
  vec2 p = d.xz / (max(d.y, 0.0) + 0.12);
  float w = texture2D(tNoise, p * 0.11 + uTime * 0.0006).r * texture2D(tNoise, p * vec2(0.31, 0.07) + 0.3).g;
  w = smoothstep(0.27, 0.46, w) * smoothstep(0.03, 0.3, d.y);
  c = mix(c, mix(vec3(0.95, 0.96, 1.0), vec3(1.0, 0.82, 0.62), pow(max(s, 0.0), 3.0)), w * 0.4);
  gl_FragColor = vec4(c, 1.0);
  #include <colorspace_fragment>
}`, {}, { side: THREE.BackSide, depthWrite: false })));

// ---------- terrain: heights, normals and cast shadows computed once, shaded per pixel ----------
const N = 1024, SIZE = 6000, CELL = SIZE / N;
const H = new Float32Array(N * N);
let maxH = -Infinity;
for (let r = 0, i = 0; r < N; r++) for (let c = 0; c < N; c++, i++) {
  H[i] = height(-SIZE / 2 + (c + 0.5) * CELL, SIZE / 2 - (r + 0.5) * CELL);
  if (H[i] > maxH) maxH = H[i];
}
const at = (c, r) => H[clamp(r, 0, N - 1) * N + clamp(c, 0, N - 1)];
function sampleH(x, z) {
  const fc = clamp((x + SIZE / 2) / CELL - 0.5, 0, N - 1.001), fr = clamp((SIZE / 2 - z) / CELL - 0.5, 0, N - 1.001);
  const c = Math.floor(fc), r = Math.floor(fr), a = fc - c, b = fr - r, i = r * N + c;
  return (H[i] * (1 - a) + H[i + 1] * a) * (1 - b) + (H[i + N] * (1 - a) + H[i + N + 1] * a) * b;
}
// Packed map: R,G = normal x,z; B = sunlit (0 in cast shadow); A = height above the lake, +-12.75 m.
const mapData = new Uint8Array(N * N * 4);
{
  const flat = Math.hypot(SUN.x, SUN.z), sx = SUN.x / flat, sz = SUN.z / flat, rise = SUN.y / flat * CELL;
  for (let r = 0, i = 0; r < N; r++) for (let c = 0; c < N; c++, i++) {
    const h = H[i];
    const dx = (at(c + 1, r) - at(c - 1, r)) / (2 * CELL), dz = (at(c, r - 1) - at(c, r + 1)) / (2 * CELL);
    const inv = 1 / Math.hypot(dx, 1, dz);
    // March towards the sun with growing steps; a near miss gives a soft shadow edge.
    let lit = 1;
    for (let d = 1.5; ; d = d * 1.06 + 0.6) {
      const cc = Math.round(c + sx * d), rr = Math.round(r - sz * d), ray = h + 1 + rise * d;
      if (cc < 0 || cc >= N || rr < 0 || rr >= N || ray > maxH) break;
      const clear = ray - H[rr * N + cc];
      if (clear <= 0) { lit = 0; break; }
      lit = Math.min(lit, 24 * clear / (d * CELL));
    }
    mapData[i * 4] = 127.5 - 127.5 * dx * inv;
    mapData[i * 4 + 1] = 127.5 - 127.5 * dz * inv;
    mapData[i * 4 + 2] = 255 * lit;
    mapData[i * 4 + 3] = clamp((h - WATER) / 25.5 + 0.5) * 255;
  }
}
const SEG = 320; // 205k triangles; the fine detail comes from the per-pixel shading, not the mesh
const terrainGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG).rotateX(-Math.PI / 2);
{
  const p = terrainGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, Math.max(sampleH(p.getX(i), p.getZ(i)), WATER));
}
scene.add(new THREE.Mesh(terrainGeo, material(`
uniform sampler2D tMap;
float sat(float x) { return clamp(x, 0.0, 1.0); }
const mat2 ROT = mat2(0.8, -0.6, 0.6, 0.8); // rotated samples hide the noise texture's repeat
void main() {
  vec4 m = texture2D(tMap, vUv);
  vec3 n; n.xz = m.rg * 2.0 - 1.0; n.y = sqrt(max(0.02, 1.0 - dot(n.xz, n.xz)));
  float up = n.y, wd = (m.a - 0.5) * 25.5;
  vec4 nL = texture2D(tNoise, ROT * vW.xz / 2900.0); // landscape-scale variation
  vec4 nA = texture2D(tNoise, vW.xz / 420.0);        // broad patches
  vec4 nB = texture2D(tNoise, ROT * vW.xz / 53.0);   // tree- and boulder-sized detail
  vec4 nC = texture2D(tNoise, vW.xz / 6.1);    // close grain; fades out with distance by itself
  float grain = (nB.r - 0.5) + (nC.b - 0.5) * 0.6;
  n = normalize(n + vec3(nB.g - 0.5, 0.0, nB.a - 0.5) * 0.22 + vec3(nC.r - 0.5, 0.0, nC.g - 0.5) * 0.3);
  float h = vW.y + (nA.r - 0.5) * 120.0;

  vec3 meadow = mix(${col('#56773a')}, ${col('#9aa860')}, sat(nL.a * 1.6 + nA.g * 0.8 - 0.7)) * (0.85 + 0.3 * nC.b);
  vec3 forest = ${col('#2a4a2e')} * (0.6 + 0.8 * nB.b);
  float forestMask = smoothstep(0.46, 0.58, nL.g * 0.6 + nL.r * 0.4 + (nA.b - 0.5) * 0.3 + (nB.b - 0.5) * 0.35) * (1.0 - smoothstep(-320.0, -260.0, h)) * smoothstep(0.78, 0.90, up);
  vec3 veg = mix(mix(meadow, forest, forestMask), ${col('#8c8558')}, smoothstep(-340.0, -250.0, h));
  vec3 rock = mix(${col('#5f564f')}, ${col('#a1968a')}, sat(nB.g * 1.8 - 0.4)) * (0.8 + 0.4 * nA.a);
  float rockMask = max(1.0 - smoothstep(0.70, 0.86, up + grain * 0.25), smoothstep(-300.0, -200.0, h + grain * 60.0));
  float snowMask = smoothstep(20.0, 100.0, h + grain * 50.0) * smoothstep(0.45, 0.70, up + grain * 0.3);
  vec3 albedo = mix(mix(veg, rock, rockMask), ${col('#f4f6fa')}, snowMask);
  albedo = mix(albedo, ${col('#8f8468')} * 0.8, (1.0 - smoothstep(0.0, 2.5, wd)) * (1.0 - snowMask)); // wet shore
  vec3 c = albedo * (SUNC * max(dot(n, SUN), 0.0) * m.b + AMB * (0.55 + 0.45 * n.y));

  if (wd < 0.3) { // lake: body colour by depth, sky reflection by viewing angle, glitter towards the sun
    vec3 rd = normalize(vW - cameraPosition);
    vec4 a = texture2D(tNoise, vW.xz / 70.0 + uTime * vec2(0.004, 0.002));
    vec4 b = texture2D(tNoise, vW.xz / 19.0 - uTime * vec2(0.006, 0.009));
    vec3 wn = normalize(vec3((a.r - 0.5) * 0.10 + (b.g - 0.5) * 0.06, 1.0, (a.g - 0.5) * 0.10 + (b.r - 0.5) * 0.06));
    vec3 rf = reflect(rd, wn); rf.y = abs(rf.y);
    float fres = 0.03 + 0.97 * pow(1.0 - max(dot(-rd, wn), 0.0), 5.0);
    vec3 body = mix(${col('#3f8f8a')}, ${col('#12384a')}, smoothstep(0.0, 9.0, -wd)) * (AMB * 0.9 + SUNC * 0.5 * m.b);
    c = mix(c, mix(body, skyColor(rf, m.b, 1.0), fres), smoothstep(0.3, -0.1, wd));
  }
  // the far edge of the terrain dissolves completely into the haze
  gl_FragColor = vec4(haze(c, vW, smoothstep(2500.0, 3000.0, length(vW.xz))), 1.0);
  #include <colorspace_fragment>
}`, { tMap: { value: dataTexture(mapData, N, N, false, THREE.ClampToEdgeWrapping) } })));

// ---------- clouds: soft painted billboards beyond the ranges (you never leave the summit) ----------
function cloudTexture(seed) {
  const W = 256, Hh = 128, d = new Uint8Array(W * Hh * 4);
  for (let y = 0, i = 0; y < Hh; y++) for (let x = 0; x < W; x++, i += 4) {
    const u = x / W, v = y / Hh, nx = u * 2 - 1;
    const e = nx * nx + (v > 0.3 ? ((v - 0.3) / 0.7) ** 2 : ((0.3 - v) / 0.3) ** 2); // flattish base, domed top
    const dens = (1 - e) * 1.2 + (fbm(u * 5 + seed, v * 3 + seed * 1.7, 5) - 0.5) * 1.0;
    const shade = 0.6 + 0.4 * sm(0.1, 0.8, v + (fbm(u * 8 + seed, v * 6, 3) - 0.5) * 0.4);
    d[i] = 255 * (shade * 0.96); d[i + 1] = 255 * (shade * 0.97); d[i + 2] = 255 * Math.min(1, shade * 1.03);
    d[i + 3] = 255 * sm(0.05, 0.6, dens) * (1 - sm(0.75, 1, e));
  }
  return dataTexture(d, W, Hh, true, THREE.ClampToEdgeWrapping);
}
const cloudMats = [3, 11, 23].map(seed => material(`
uniform sampler2D tCloud;
void main() {
  vec4 t = texture2D(tCloud, vUv);
  float s = max(dot(normalize(vW - cameraPosition), SUN), 0.0);
  vec3 c = t.rgb * (vec3(0.62, 0.68, 0.82) + SUNC * (0.45 + 1.1 * pow(s, 6.0)));
  gl_FragColor = vec4(haze(c, vW, 0.0), t.a);
  #include <colorspace_fragment>
}`, { tCloud: { value: cloudTexture(seed) } }, { transparent: true, depthWrite: false }));
const clouds = new THREE.Group();
for (let i = 0; i < 16; i++) {
  const a = i * 0.39 + hash(i, 1) * 0.2, r = 3300 + 1300 * hash(i, 2), w = 900 + 1300 * hash(i, 3);
  const cloud = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 2), cloudMats[i % 3]);
  cloud.position.set(Math.cos(a) * r, 150 + 1100 * hash(i, 4) ** 2, Math.sin(a) * r);
  cloud.lookAt(0, cloud.position.y, 0);
  clouds.add(cloud);
}
scene.add(clouds);

// ---------- the summit you sit on: real lights and shadows for the things within reach ----------
const sunLight = new THREE.DirectionalLight('#ffe0bd', 3.2);
sunLight.position.copy(SUN).multiplyScalar(30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 60 });
sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.03;
scene.add(sunLight, new THREE.HemisphereLight('#a9c1ec', '#5c4d40', 1.4));

const RT = 512, rockData = new Uint8Array(RT * RT * 4);
for (let y = 0, i = 0; y < RT; y++) for (let x = 0; x < RT; x++, i += 4) {
  const u = x / RT, v = y / RT;
  const crack = Math.abs(2 * fbm(u * 5 + 40, v * 5 + 11, 5, 5) - 1);
  let l = 0.55 + (fbm(u * 6, v * 6, 6, 6) - 0.5) * 0.9 + (noise(u * 128, v * 128, 128) - 0.5) * 0.18;
  l *= 0.5 + 0.5 * sm(0, 0.1, crack);
  const lichen = 0.3 * sm(0.6, 0.68, fbm(u * 9 + 3, v * 9 + 77, 4, 9));
  rockData[i] = 255 * clamp(l * (0.98 - lichen * 0.1)); rockData[i + 1] = 255 * clamp(l * (0.93 + lichen * 0.1));
  rockData[i + 2] = 255 * clamp(l * (0.87 - lichen * 0.5)); rockData[i + 3] = 255;
}
const rockTex = dataTexture(rockData, RT, RT, true);
const rockMat = new THREE.MeshLambertMaterial({ map: rockTex, bumpMap: rockTex, bumpScale: 2 });
function addRock(geo) {
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, rockMat);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
}

// A level seat 2.2 m in radius, then crags falling away into the terrain below.
const cragGeo = new THREE.RingGeometry(0.001, 1, 96, 56).rotateX(-Math.PI / 2);
{
  const p = cragGeo.attributes.position, uv = cragGeo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const a = Math.atan2(p.getZ(i), p.getX(i)) + Math.PI / 2; // puts the mesh seam behind you
    let R = 70 * Math.hypot(p.getX(i), p.getZ(i)) ** 2.4;      // rings packed densely near the seat
    const out = sm(2.2, 7, R);
    R *= 1 + out * 0.5 * (fbm(Math.cos(a) * 2.2 + 5 + R * 0.03, Math.sin(a) * 2.2 + 9, 4) - 0.5);
    const x = Math.cos(a) * R, z = Math.sin(a) * R;
    let y = (fbm(x * 0.9 + 3, z * 0.9 + 8, 3) - 0.5) * 0.05; // a few cm of unevenness underfoot
    if (R > 2.2) y -= 1.5 * (R - 2.2) ** 1.15 * (0.75 + 0.5 * fbm(x * 0.12 + 20, z * 0.12 + 4, 3));
    y += out * (fbm(x * 0.35 + 1, z * 0.35 + 2, 4) - 0.5) * 3;
    p.setXYZ(i, x, y, z);
    uv.setXY(i, (x + y * 0.7) / 3, (z + y * 0.7) / 3);
  }
}
addRock(cragGeo);

// Loose boulders and a small cairn: [x, z, size, y]
[[1.9, -1.2, 0.35], [-2.0, -0.6, 0.28], [-1.5, 1.6, 0.4], [1.2, 2.0, 0.3], [2.2, 0.5, 0.22],
  [-1.1, -1.9, 0.28], [-1.1, -1.9, 0.21, 0.3], [-1.08, -1.92, 0.15, 0.53], [-1.1, -1.9, 0.1, 0.7]].forEach(([x, z, s, y = 0], i) => {
  const g = new THREE.SphereGeometry(1, 24, 16), p = g.attributes.position;
  for (let j = 0; j < p.count; j++) {
    const X = p.getX(j), Y = p.getY(j), Z = p.getZ(j);
    const k = s * (1 + 0.5 * (fbm(X * 1.3 + i * 7.1, Y * 1.3 + Z * 1.9 + i * 3.3, 3) - 0.5));
    p.setXYZ(j, X * k, Y * k * 0.62, Z * k * 1.15);
  }
  addRock(g.rotateY(i * 1.7).translate(x, y + s * 0.35, z));
});
renderer.shadowMap.needsUpdate = true;
console.log(`mountain built in ${Math.round(performance.now() - buildStart)} ms`);

// ---------- sound (all synthesised, no audio files) ----------
let ctx, sound;
function startAudio() {
  ctx ??= new AudioContext();
  ctx.resume();
  const now = ctx.currentTime, out = ctx.createGain();
  out.gain.setValueAtTime(0, now);
  out.gain.linearRampToValueAtTime(1, now + 4);
  out.connect(ctx.destination);

  // wind: looped white noise through a band-pass, with a slow gust
  const buf = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), wind = ctx.createGain();
  const gust = ctx.createOscillator(), gustAmt = ctx.createGain();
  src.buffer = buf; src.loop = true;
  bp.type = 'bandpass'; bp.frequency.value = 300; bp.Q.value = 0.5;
  wind.gain.value = WIND_LEVEL * 0.7;
  gust.frequency.value = 0.06; gustAmt.gain.value = WIND_LEVEL * 0.3;
  gust.connect(gustAmt).connect(wind.gain);
  src.connect(bp).connect(wind).connect(out);

  // quiet warm drone underneath
  const lp = ctx.createBiquadFilter(), droneGain = ctx.createGain();
  lp.frequency.value = 250; droneGain.gain.value = DRONE_LEVEL;
  lp.connect(droneGain).connect(out);
  const oscs = [110, 110.6, 165, 220.4].map(f => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = f; g.gain.value = 0.25;
    o.connect(g).connect(lp);
    return o;
  });
  const sources = [src, gust, ...oscs];
  sources.forEach(s => s.start());
  sound = { out, bp, lp, sources };
}
function stopAudio() {
  if (!sound) return;
  const { out, sources } = sound, now = ctx.currentTime;
  sound = null;
  out.gain.cancelScheduledValues(now);
  out.gain.setValueAtTime(out.gain.value, now);
  out.gain.linearRampToValueAtTime(0, now + 3);
  sources.forEach(s => s.stop(now + 3));
}
function bell() {
  const now = ctx.currentTime;
  for (const [f, vol] of [[528, 0.3], [1056, 0.08], [1584, 0.04]]) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = f;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 5);
    o.connect(g).connect(ctx.destination);
    o.start(now); o.stop(now + 5);
  }
}

// ---------- session ----------
const ui = document.getElementById('ui'), endBtn = document.getElementById('end');
document.getElementById('loading').hidden = true;
document.getElementById('lengths').hidden = false;
let running = false, t0 = 0, duration = 0, xrSession = null, vrOK = false;
navigator.xr?.isSessionSupported('immersive-vr').then(ok => { vrOK = ok; }).catch(() => {});

async function start(minutes) {
  startAudio(); bell();
  duration = minutes * 60; t0 = performance.now(); running = true;
  ui.hidden = true; endBtn.hidden = false;
  if (!vrOK) return;
  try {
    xrSession = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
    xrSession.addEventListener('end', () => { xrSession = null; stop(); });
    await renderer.xr.setSession(xrSession);
    t0 = performance.now(); // the permission prompt shouldn't eat session time
  } catch (e) {
    console.warn('VR unavailable, playing on screen instead', e);
    xrSession?.end().catch(() => {});
  }
}
function stop() {
  if (!running) return;
  running = false;
  bell(); stopAudio();
  ui.hidden = false; endBtn.hidden = true;
  xrSession?.end().catch(() => {});
}
document.getElementById('lengths').addEventListener('click', e => {
  const min = Number(e.target.dataset?.min);
  if (min) start(min);
});
endBtn.addEventListener('click', stop);

// On a flat screen, drag to look around (the headset does this by itself).
renderer.domElement.addEventListener('pointermove', e => {
  if (!e.buttons || renderer.xr.isPresenting) return;
  yaw += e.movementX * 0.003;
  pitch = clamp(pitch + e.movementY * 0.003, -1.2, 1.2);
  camera.rotation.set(pitch, yaw, 0);
});
addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  const now = performance.now(), t = (running ? now - t0 : now) / 1000, b = breath(t);
  U.uBreath.value = b;
  U.uTime.value = now / 1000;
  clouds.rotation.y = now * 4e-7; // about 1 m/s out at the far ranges
  // Wind and drone open up on the in-breath, so the pace can be followed with eyes closed.
  if (sound) {
    sound.bp.frequency.setTargetAtTime(260 + 240 * b, ctx.currentTime, 0.2);
    sound.lp.frequency.setTargetAtTime(250 + 450 * b, ctx.currentTime, 0.1);
  }
  if (running && t >= duration) stop();
  renderer.render(scene, camera);
});
